name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk aegis-mesh.apk

      - uses: actions/upload-artifact@v4
        with:
          name: aegis-mesh-apk
          path: android-app/aegis-mesh.apk

      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Aegis APK (najnowszy build)
          prerelease: true
          make_latest: false
          body: |
            Automatyczny build z gałęzi main (${{ github.sha }}).
            Build debug: pozwala na HTTP w sieci lokalnej (serwer AEGIS w LAN).
            Instalacja: pobierz aegis-mesh.apk na telefon i zezwól na instalację z nieznanych źródeł.
          files: android-app/aegis-mesh.apk
